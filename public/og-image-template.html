<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NisArt Gallery - Social Media Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            z-index: 2;
            position: relative;
        }
        
        .logo {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tagline {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .description {
            font-size: 24px;
            opacity: 0.9;
            max-width: 800px;
            line-height: 1.4;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .decorative-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .circle1 {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
        }
        
        .circle2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            left: -100px;
        }
        
        .circle3 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 100px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .url {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 20px;
            opacity: 0.8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="decorative-elements">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
    </div>
    
    <div class="container">
        <div class="logo">🎨 NisArt Gallery</div>
        <div class="tagline">Discover & Share Amazing Digital Art</div>
        <div class="description">
            Explore a curated collection of stunning digital artwork from talented artists worldwide
        </div>
    </div>
    
    <div class="url">nisart.blockdev.my.id</div>
</body>
</html>
