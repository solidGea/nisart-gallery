<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Default Meta Tags (will be overridden by react-helmet-async) -->
    <title>NisArt Gallery - Discover & Share Amazing Digital Art</title>
    <meta name="description" content="Explore a curated collection of stunning digital artwork from talented artists worldwide. Upload, discover, and share beautiful art in our vibrant community." />
    <meta name="keywords" content="digital art, art gallery, artwork, artists, creative, design, illustration, photography, visual art, art community" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nisart.blockdev.my.id/" />
    <meta property="og:title" content="NisArt Gallery - Discover & Share Amazing Digital Art" />
    <meta property="og:description" content="Explore a curated collection of stunning digital artwork from talented artists worldwide. Upload, discover, and share beautiful art in our vibrant community." />
    <meta property="og:image" content="https://nisart.blockdev.my.id/android-chrome-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="NisArt Gallery - Digital Art Community" />
    <meta property="og:site_name" content="NisArt Gallery" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nisart.blockdev.my.id/" />
    <meta property="twitter:title" content="NisArt Gallery - Discover & Share Amazing Digital Art" />
    <meta property="twitter:description" content="Explore a curated collection of stunning digital artwork from talented artists worldwide. Upload, discover, and share beautiful art in our vibrant community." />
    <meta property="twitter:image" content="https://nisart.blockdev.my.id/android-chrome-512x512.png" />
    <meta property="twitter:image:alt" content="NisArt Gallery - Digital Art Community" />
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="author" content="NisArt Gallery" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
